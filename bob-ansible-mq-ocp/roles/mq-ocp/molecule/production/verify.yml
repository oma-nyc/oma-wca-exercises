---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Get OpenShift namespace
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ mq_namespace | default('mq-prod') }}"
      register: namespace_result
      failed_when: namespace_result.resources | length == 0

    - name: Verify namespace exists
      ansible.builtin.assert:
        that:
          - namespace_result.resources | length > 0
          - namespace_result.resources[0].status.phase == "Active"
        fail_msg: "Namespace {{ mq_namespace | default('mq-prod') }} does not exist or is not active"
        success_msg: "Namespace {{ mq_namespace | default('mq-prod') }} exists and is active"

    - name: Get MQ deployment
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: "{{ mq_namespace | default('mq-prod') }}"
        name: "{{ mq_deployment_name | default('mq-deployment') }}"
      register: deployment_result
      failed_when: deployment_result.resources | length == 0

    - name: Verify MQ deployment exists and has correct replicas
      ansible.builtin.assert:
        that:
          - deployment_result.resources | length > 0
          - deployment_result.resources[0].status.availableReplicas is defined
          - deployment_result.resources[0].status.availableReplicas == 3
          - deployment_result.resources[0].spec.replicas == 3
        fail_msg: "MQ deployment does not exist or does not have 3 replicas"
        success_msg: "MQ deployment exists and has 3 replicas"

    - name: Verify MQ deployment resource requests and limits
      ansible.builtin.assert:
        that:
          - deployment_result.resources[0].spec.template.spec.containers[0].resources.requests.cpu == "1"
          - deployment_result.resources[0].spec.template.spec.containers[0].resources.requests.memory == "1Gi"
          - deployment_result.resources[0].spec.template.spec.containers[0].resources.limits.cpu == "2"
          - deployment_result.resources[0].spec.template.spec.containers[0].resources.limits.memory == "2Gi"
        fail_msg: "MQ deployment does not have correct resource requests and limits"
        success_msg: "MQ deployment has correct resource requests and limits"

    - name: Get MQ service
      kubernetes.core.k8s_info:
        kind: Service
        namespace: "{{ mq_namespace | default('mq-prod') }}"
        name: "{{ mq_service_name | default('mq-service') }}"
      register: service_result
      failed_when: service_result.resources | length == 0

    - name: Verify MQ service exists
      ansible.builtin.assert:
        that:
          - service_result.resources | length > 0
        fail_msg: "MQ service does not exist"
        success_msg: "MQ service exists"

    - name: Get MQ persistent volume claim
      kubernetes.core.k8s_info:
        kind: PersistentVolumeClaim
        namespace: "{{ mq_namespace | default('mq-prod') }}"
        name: "{{ mq_pvc_name | default('mq-data-pvc') }}"
      register: pvc_result
      failed_when: pvc_result.resources | length == 0

    - name: Verify MQ PVC exists with correct storage size and class
      ansible.builtin.assert:
        that:
          - pvc_result.resources | length > 0
          - pvc_result.resources[0].spec.resources.requests.storage == "10Gi"
          - pvc_result.resources[0].spec.storageClassName == "managed-premium"
        fail_msg: "MQ PVC does not exist or does not have correct storage size and class"
        success_msg: "MQ PVC exists with correct storage size and class"

    - name: Get MQ route (if enabled)
      kubernetes.core.k8s_info:
        kind: Route
        namespace: "{{ mq_namespace | default('mq-prod') }}"
        name: "{{ mq_route_name | default('mq-route') }}"
      register: route_result
      when: mq_expose_web_console | default(true)

    - name: Verify MQ route exists with TLS (if enabled)
      ansible.builtin.assert:
        that:
          - route_result.resources | length > 0
          - route_result.resources[0].spec.host is defined
          - route_result.resources[0].spec.tls is defined
        fail_msg: "MQ route does not exist or does not have TLS configured"
        success_msg: "MQ route exists with TLS configured"
      when: mq_expose_web_console | default(true) and mq_enable_tls | default(true)

    - name: Get MQ pods
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ mq_namespace | default('mq-prod') }}"
        label_selectors:
          - "app={{ mq_app_label | default('ibm-mq') }}"
      register: pod_result
      failed_when: pod_result.resources | length == 0

    - name: Verify MQ pods are running
      ansible.builtin.assert:
        that:
          - pod_result.resources | length == 3
          - pod_result.resources | map(attribute='status.phase') | list | unique == ["Running"]
        fail_msg: "Not all MQ pods are running"
        success_msg: "All MQ pods are running"

    - name: Check MQ pod logs for successful startup
      kubernetes.core.k8s_log:
        name: "{{ pod_result.resources[0].metadata.name }}"
        namespace: "{{ mq_namespace | default('mq-prod') }}"
      register: pod_logs

    - name: Verify MQ startup messages in logs
      ansible.builtin.assert:
        that:
          - pod_logs.log is search("AMQ5026I: Queue Manager running")
        fail_msg: "MQ queue manager startup message not found in logs"
        success_msg: "MQ queue manager startup message found in logs"

    - name: Verify MQ queue manager is running
      ansible.builtin.command:
        cmd: >
          oc exec -n {{ mq_namespace | default('mq-prod') }} {{ pod_result.resources[0].metadata.name }} -- 
          dspmq -m {{ mq_qmgr_name | default('PRODQM') }}
      register: dspmq_result
      failed_when: dspmq_result.rc != 0 or dspmq_result.stdout is not search("Running")

    - name: Display verification results
      ansible.builtin.debug:
        msg: "IBM MQ production deployment verification completed successfully"

