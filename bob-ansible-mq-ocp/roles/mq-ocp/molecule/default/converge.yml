---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: "Include mq-ocp role"
      include_role:
        name: "mq-ocp"
      vars:
        # Test-specific variables
        mq_namespace: "mq-test"
        mq_qmgr_name: "TESTQM"
        mq_validate_deployment: true
        
        # Mock Vault integration for testing
        vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://mock-vault:8200', true) }}"
        vault_auth_method: "token"
        vault_token: "{{ lookup('env', 'VAULT_TOKEN') | default('mock-token', true) }}"
        
        # Use mock secrets for testing
        mq_admin_user: "admin"
        mq_admin_password: "passw0rd"
        mq_app_user: "app"
        mq_app_password: "apppassw0rd"
        
        # Reduced resource requirements for testing
        mq_cpu_request: "200m"
        mq_memory_request: "256Mi"
        mq_cpu_limit: "500m"
        mq_memory_limit: "512Mi"

# Made with Bob
