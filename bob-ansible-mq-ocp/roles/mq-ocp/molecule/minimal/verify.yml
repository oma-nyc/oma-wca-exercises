---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Get OpenShift namespace
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ mq_namespace | default('mq-minimal') }}"
      register: namespace_result
      failed_when: namespace_result.resources | length == 0

    - name: Verify namespace exists
      ansible.builtin.assert:
        that:
          - namespace_result.resources | length > 0
          - namespace_result.resources[0].status.phase == "Active"
        fail_msg: "Namespace {{ mq_namespace | default('mq-minimal') }} does not exist or is not active"
        success_msg: "Namespace {{ mq_namespace | default('mq-minimal') }} exists and is active"

    - name: Get MQ deployment
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: "{{ mq_namespace | default('mq-minimal') }}"
        name: "{{ mq_deployment_name | default('mq-deployment') }}"
      register: deployment_result
      failed_when: deployment_result.resources | length == 0

    - name: Verify MQ deployment exists with minimal configuration
      ansible.builtin.assert:
        that:
          - deployment_result.resources | length > 0
          - deployment_result.resources[0].status.availableReplicas is defined
          - deployment_result.resources[0].status.availableReplicas == 1
          - deployment_result.resources[0].spec.replicas == 1
        fail_msg: "MQ deployment does not exist or does not have 1 replica"
        success_msg: "MQ deployment exists with 1 replica"

    - name: Verify MQ deployment minimal resource configuration
      ansible.builtin.assert:
        that:
          - deployment_result.resources[0].spec.template.spec.containers[0].resources.requests.cpu == "100m"
          - deployment_result.resources[0].spec.template.spec.containers[0].resources.requests.memory == "256Mi"
          - deployment_result.resources[0].spec.template.spec.containers[0].resources.limits.cpu == "200m"
          - deployment_result.resources[0].spec.template.spec.containers[0].resources.limits.memory == "512Mi"
        fail_msg: "MQ deployment does not have correct minimal resource configuration"
        success_msg: "MQ deployment has correct minimal resource configuration"

    - name: Get MQ service
      kubernetes.core.k8s_info:
        kind: Service
        namespace: "{{ mq_namespace | default('mq-minimal') }}"
        name: "{{ mq_service_name | default('mq-service') }}"
      register: service_result
      failed_when: service_result.resources | length == 0

    - name: Verify MQ service exists
      ansible.builtin.assert:
        that:
          - service_result.resources | length > 0
        fail_msg: "MQ service does not exist"
        success_msg: "MQ service exists"

    - name: Get MQ persistent volume claim
      kubernetes.core.k8s_info:
        kind: PersistentVolumeClaim
        namespace: "{{ mq_namespace | default('mq-minimal') }}"
        name: "{{ mq_pvc_name | default('mq-data-pvc') }}"
      register: pvc_result
      failed_when: pvc_result.resources | length == 0

    - name: Verify MQ PVC exists with minimal storage
      ansible.builtin.assert:
        that:
          - pvc_result.resources | length > 0
          - pvc_result.resources[0].spec.resources.requests.storage == "1Gi"
        fail_msg: "MQ PVC does not exist or does not have correct storage size"
        success_msg: "MQ PVC exists with correct minimal storage size"

    - name: Check if MQ route exists (should not)
      kubernetes.core.k8s_info:
        kind: Route
        namespace: "{{ mq_namespace | default('mq-minimal') }}"
        name: "{{ mq_route_name | default('mq-route') }}"
      register: route_result
      failed_when: false

    - name: Verify MQ route does not exist (as expected)
      ansible.builtin.assert:
        that:
          - route_result.resources | length == 0
        fail_msg: "MQ route exists but should not in minimal configuration"
        success_msg: "MQ route does not exist as expected in minimal configuration"

    - name: Get MQ pod
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ mq_namespace | default('mq-minimal') }}"
        label_selectors:
          - "app={{ mq_app_label | default('ibm-mq') }}"
      register: pod_result
      failed_when: pod_result.resources | length == 0

    - name: Verify MQ pod is running
      ansible.builtin.assert:
        that:
          - pod_result.resources | length == 1
          - pod_result.resources[0].status.phase == "Running"
        fail_msg: "MQ pod is not running"
        success_msg: "MQ pod is running"

    - name: Check MQ pod logs for successful startup
      kubernetes.core.k8s_log:
        name: "{{ pod_result.resources[0].metadata.name }}"
        namespace: "{{ mq_namespace | default('mq-minimal') }}"
      register: pod_logs

    - name: Verify MQ startup messages in logs
      ansible.builtin.assert:
        that:
          - pod_logs.log is search("AMQ5026I: Queue Manager running")
        fail_msg: "MQ queue manager startup message not found in logs"
        success_msg: "MQ queue manager startup message found in logs"

    - name: Verify MQ queue manager is running
      ansible.builtin.command:
        cmd: >
          oc exec -n {{ mq_namespace | default('mq-minimal') }} {{ pod_result.resources[0].metadata.name }} -- 
          dspmq -m {{ mq_qmgr_name | default('MINQM') }}
      register: dspmq_result
      failed_when: dspmq_result.rc != 0 or dspmq_result.stdout is not search("Running")

    - name: Display verification results
      ansible.builtin.debug:
        msg: "IBM MQ minimal deployment verification completed successfully"

