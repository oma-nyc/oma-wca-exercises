---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/default/requirements.yml
driver:
  name: delegated
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
platforms:
  - name: instance
    image: localhost/molecule:latest
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../roles
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
      timeout: 60
  inventory:
    host_vars:
      instance:
        ansible_python_interpreter: /usr/bin/python3
        ansible_connection: local
        # Minimal configuration variables
        mq_namespace: "mq-minimal"
        mq_replicas: 1
        mq_cpu_request: "100m"
        mq_memory_request: "256Mi"
        mq_cpu_limit: "200m"
        mq_memory_limit: "512Mi"
        mq_storage_size: "1Gi"
        mq_validate_deployment: true
        mq_expose_web_console: false
        mq_enable_tls: false
verifier:
  name: ansible
lint: |
  set -e
  yamllint .
  ansible-lint
scenario:
  name: minimal
  test_sequence:
    - dependency
    - lint
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

