---
# Default variables for mq-ocp role
# These values can be overridden by setting them in your playbook or inventory

#------------------------------------------------------------------------------
# OpenShift Configuration
#------------------------------------------------------------------------------

# OpenShift version - must be 4.18 or higher
openshift_version: "4.18"

# Namespace configuration
mq_namespace: "mq-dev"                      # Namespace for IBM MQ deployment
mq_create_namespace: true                   # Whether to create the namespace if it doesn't exist
mq_namespace_labels:                        # Labels to apply to the namespace
  app.kubernetes.io/name: ibm-mq
  app.kubernetes.io/managed-by: ansible

# Service account configuration
mq_service_account: "mq-service-account"    # Service account name for IBM MQ
mq_scc_name: "mq-scc"                       # Security context constraints name
mq_role_name: "mq-role"                     # Role name for MQ service account
mq_role_binding_name: "mq-role-binding"     # Role binding name for MQ service account

#------------------------------------------------------------------------------
# Storage Configuration
#------------------------------------------------------------------------------

# Persistent volume claim configuration
mq_pvc_name: "mq-data-pvc"                  # Persistent volume claim name
mq_storage_size: "2Gi"                      # Storage size for MQ data
mq_storage_class: ""                        # Storage class (empty for default)
mq_access_mode: "ReadWriteOnce"             # Access mode for the PVC

#------------------------------------------------------------------------------
# IBM MQ Configuration
#------------------------------------------------------------------------------

# Deployment configuration
mq_deployment_name: "mq-deployment"         # Deployment name
mq_app_label: "ibm-mq"                      # App label for selectors
mq_container_name: "mq"                     # Container name
mq_image: "icr.io/ibm-messaging/mq"         # IBM MQ image
mq_version: "9.3.0.0"                       # IBM MQ version
mq_image_pull_policy: "IfNotPresent"        # Image pull policy
mq_image_pull_secrets: []                   # Image pull secrets (if needed)

# Queue manager configuration
mq_license: "accept"                        # IBM MQ license acceptance
mq_qmgr_name: "QM1"                         # Queue manager name
mq_admin_secret_name: "mq-admin-secret"     # Admin secret name
mq_config_map_name: "mq-config"             # ConfigMap name for MQ configuration

# Resource limits and requests
mq_replicas: 1                              # Number of replicas
mq_cpu_request: "500m"                      # CPU request
mq_memory_request: "512Mi"                  # Memory request
mq_cpu_limit: "1"                           # CPU limit
mq_memory_limit: "1Gi"                      # Memory limit

# Service and route configuration
mq_service_name: "mq-service"               # Service name
mq_service_type: "ClusterIP"                # Service type (ClusterIP, NodePort)
mq_route_name: "mq-route"                   # Route name
mq_expose_web_console: true                 # Whether to expose the web console via route
mq_expose_mq_port: false                    # Whether to expose the MQ port via route

# MQ ports configuration
mq_port_mapping:                            # Port mapping for MQ services
  - name: mq
    port: 1414
    targetPort: 1414
    protocol: TCP
  - name: mqweb
    port: 9443
    targetPort: 9443
    protocol: TCP

# MQ custom configuration
mq_custom_ini: |                            # Custom MQ configuration (mq.ini)
  # MQ Configuration
  AllQueueManagers:
    DefaultQueueManager={{ mq_qmgr_name }}
  
  QueueManager:
    Name={{ mq_qmgr_name }}
    Directory={{ mq_qmgr_name }}

# MQ queues to create (optional)
mq_queues: []
# Example:
# mq_queues:
#   - name: "APP.QUEUE.1"
#     type: "local"
#   - name: "APP.QUEUE.2"
#     type: "local"

# MQ channels to create (optional)
mq_channels: []
# Example:
# mq_channels:
#   - name: "APP.SVRCONN"
#     type: "SVRCONN"

#------------------------------------------------------------------------------
# TLS Configuration
#------------------------------------------------------------------------------

# TLS settings
mq_enable_tls: false                        # Whether to enable TLS
mq_tls_secret_name: "mq-tls-secret"         # TLS secret name
mq_tls_passphrase: ""                       # TLS passphrase (should be retrieved from Vault)

#------------------------------------------------------------------------------
# Hashicorp Vault Configuration
#------------------------------------------------------------------------------

# Vault server configuration
vault_addr: "https://vault.example.com:8200"  # Vault server address
vault_auth_method: "approle"                  # Auth method: token, approle, kubernetes
vault_auth_mount_point: "auth/approle"        # Default mount point for auth method
vault_secret_path: "secret/mq"                # Base path for MQ secrets in Vault

# Vault secret paths (relative to vault_secret_path)
mq_admin_password_path: "mq-admin-password"   # Path to admin password secret
mq_app_password_path: "mq-app-password"       # Path to app password secret
mq_tls_cert_path: "mq-tls-cert"               # Path to TLS certificate secret

# These variables should be provided securely (not in defaults)
# vault_token: ""                            # For token auth method
# vault_role_id: ""                          # For approle auth method
# vault_secret_id: ""                        # For approle auth method
# vault_role: ""                             # For kubernetes auth method

#------------------------------------------------------------------------------
# Health and Monitoring Configuration
#------------------------------------------------------------------------------

# Liveness and readiness probe configuration
mq_enable_probes: true                      # Whether to enable health probes
mq_liveness_probe:                          # Liveness probe configuration
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
mq_readiness_probe:                         # Readiness probe configuration
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Monitoring configuration
mq_enable_prometheus: false                 # Whether to enable Prometheus metrics
mq_prometheus_port: 9157                    # Prometheus metrics port

#------------------------------------------------------------------------------
# Deployment Strategy Configuration
#------------------------------------------------------------------------------

# Update strategy
mq_update_strategy: "RollingUpdate"         # Deployment update strategy
mq_max_surge: 1                             # Max surge for rolling update
mq_max_unavailable: 0                       # Max unavailable for rolling update

# Pod scheduling
mq_node_selector: {}                        # Node selector for pod scheduling
mq_tolerations: []                          # Tolerations for pod scheduling
mq_affinity: {}                             # Affinity rules for pod scheduling

#------------------------------------------------------------------------------
# Security Configuration
#------------------------------------------------------------------------------

# Pod security context
mq_pod_security_context:                    # Pod security context
  fsGroup: 1001
mq_container_security_context:              # Container security context
  allowPrivilegeEscalation: false
  capabilities:
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - SETGID
      - SETUID
    drop:
      - ALL

#------------------------------------------------------------------------------
# OpenShift 4.18 Specific Configuration
#------------------------------------------------------------------------------

# Network policies
mq_create_network_policy: true              # Whether to create network policies

# Resource quotas
mq_create_resource_quota: false             # Whether to create resource quotas
mq_quota_cpu_request: "4"                   # CPU request quota
mq_quota_memory_request: "4Gi"              # Memory request quota
mq_quota_cpu_limit: "8"                     # CPU limit quota
mq_quota_memory_limit: "8Gi"                # Memory limit quota
mq_quota_pvc_count: "5"                     # PVC count quota
mq_quota_pod_count: "10"                    # Pod count quota
mq_quota_service_count: "5"                 # Service count quota

# Priority class
mq_create_priority_class: false             # Whether to create priority class
mq_priority_class_name: "mq-priority"       # Priority class name
mq_priority_value: 1000                     # Priority value

# Pod disruption budget
mq_create_pod_disruption_budget: true       # Whether to create pod disruption budget
mq_pdb_min_available: 1                     # Minimum available pods

# Scheduler
mq_scheduler_name: "default-scheduler"      # Scheduler name

#------------------------------------------------------------------------------
# Validation and Testing Configuration
#------------------------------------------------------------------------------

# Validation settings
mq_validate_deployment: true                # Whether to validate the deployment
mq_validation_retries: 10                   # Number of retries for validation
mq_validation_delay: 30                     # Delay between retries (seconds)
mq_create_test_queue: true                  # Whether to create a test queue
mq_cleanup_test_queue: true                 # Whether to clean up test queue
mq_allow_pod_restart: false                 # Whether to allow pod restart

