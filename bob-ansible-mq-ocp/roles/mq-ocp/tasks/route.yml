---
# tasks/route.yml
#
# Route creation for mq-ocp role
# Specific to OpenShift 4.18 or higher
#
# This file implements OpenShift routes for IBM MQ.
# OpenShift 4.18 includes enhanced routing capabilities.

- name: Create route for IBM MQ web console
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: "{{ mq_route_name }}"
        namespace: "{{ mq_namespace }}"
        labels:
          app: "{{ mq_app_label }}"
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
        # OpenShift 4.18 supports additional route annotations
        annotations:
          haproxy.router.openshift.io/timeout: "30s"
          haproxy.router.openshift.io/balance: "roundrobin"
      spec:
        to:
          kind: Service
          name: "{{ mq_service_name }}"
        port:
          targetPort: mqweb
        tls:
          termination: passthrough
          insecureEdgeTerminationPolicy: Redirect
        # OpenShift 4.18 supports wildcard routes
        wildcardPolicy: None
  register: route_result
  when: mq_expose_web_console | bool
  tags:
    - route
    - networking

- name: Create route for IBM MQ port (if enabled)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: "{{ mq_route_name }}-mq"
        namespace: "{{ mq_namespace }}"
        labels:
          app: "{{ mq_app_label }}"
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
        annotations:
          haproxy.router.openshift.io/timeout: "60s"
      spec:
        to:
          kind: Service
          name: "{{ mq_service_name }}"
        port:
          targetPort: mq
        tls:
          termination: passthrough
          insecureEdgeTerminationPolicy: Redirect
  register: mq_route_result
  when: mq_expose_mq_port | bool
  tags:
    - route
    - networking

- name: Display MQ web console URL
  ansible.builtin.debug:
    msg: "MQ web console URL: https://{{ route_result.result.spec.host }}"
  when: mq_expose_web_console | bool and route_result.changed
  notify: Display MQ web console URL
  tags:
    - route
    - networking

- name: Display MQ port URL
  ansible.builtin.debug:
    msg: "MQ port URL: https://{{ mq_route_result.result.spec.host }}"
  when: mq_expose_mq_port | bool and mq_route_result.changed
  tags:
    - route
    - networking

