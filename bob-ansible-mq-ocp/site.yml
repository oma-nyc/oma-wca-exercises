---
# site.yml
#
# Main playbook for deploying IBM MQ on OpenShift with Hashicorp Vault integration
#
# This playbook serves as the main entry point for deploying IBM MQ on OpenShift.
# It uses the mq-ocp role with appropriate variables for customization.
#
# Usage:
#   ansible-playbook site.yml -e "vault_addr=https://vault.example.com:8200"
#
# Author: Your Team
# Last Updated: 2025-10-20

- name: Deploy IBM MQ on OpenShift
  hosts: localhost
  connection: local
  gather_facts: false
  
  # These variables can be overridden via command line or inventory
  vars:
    # OpenShift configuration
    openshift_version: "4.18"
    mq_namespace: "mq-prod"
    
    # IBM MQ configuration
    mq_qmgr_name: "QM1"
    mq_image: "icr.io/ibm-messaging/mq"
    mq_version: "9.3.0.0"
    mq_license: "accept"
    
    # Storage configuration
    mq_storage_size: "2Gi"
    
    # Resource configuration
    mq_cpu_request: "500m"
    mq_memory_request: "512Mi"
    mq_cpu_limit: "1"
    mq_memory_limit: "1Gi"
    
    # Networking configuration
    mq_expose_web_console: true
    
    # Validation configuration
    mq_validate_deployment: true
    
    # Vault configuration - these should be provided securely
    # vault_addr: "https://vault.example.com:8200"
    # vault_auth_method: "approle"
    # vault_role_id: ""
    # vault_secret_id: ""
    # vault_secret_path: "secret/mq"
  
  # Pre-tasks to validate requirements
  pre_tasks:
    - name: Verify OpenShift CLI is installed
      ansible.builtin.command: which oc
      register: oc_check
      changed_when: false
      failed_when: oc_check.rc != 0
      
    - name: Verify OpenShift login status
      ansible.builtin.command: oc whoami
      register: oc_whoami
      changed_when: false
      failed_when: oc_whoami.rc != 0
      
    - name: Verify Vault address is provided
      ansible.builtin.assert:
        that: vault_addr is defined
        fail_msg: "Vault address (vault_addr) must be provided"
        success_msg: "Vault address is provided"
        
    - name: Verify Vault authentication method is provided
      ansible.builtin.assert:
        that: vault_auth_method is defined
        fail_msg: "Vault authentication method (vault_auth_method) must be provided"
        success_msg: "Vault authentication method is provided"
        
    - name: Verify Vault credentials are provided based on auth method
      ansible.builtin.assert:
        that: >-
          (vault_auth_method == 'token' and vault_token is defined) or
          (vault_auth_method == 'approle' and vault_role_id is defined and vault_secret_id is defined) or
          (vault_auth_method == 'kubernetes' and vault_role is defined)
        fail_msg: "Required Vault credentials for auth method '{{ vault_auth_method }}' are not provided"
        success_msg: "Vault credentials are provided"
  
  # Apply the mq-ocp role
  roles:
    - role: mq-ocp
  
  # Post-tasks to display information
  post_tasks:
    - name: Get IBM MQ route information
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        name: "{{ mq_route_name | default('mq-route') }}"
        namespace: "{{ mq_namespace }}"
      register: mq_route_info
      when: mq_expose_web_console | default(true) | bool
      
    - name: Display IBM MQ deployment information
      ansible.builtin.debug:
        msg:
          - "IBM MQ deployment completed successfully"
          - "Namespace: {{ mq_namespace }}"
          - "Queue Manager: {{ mq_qmgr_name }}"
          - "Web Console URL: {{ mq_route_info.resources[0].spec.host | default('Not exposed') if mq_route_info.resources is defined and mq_route_info.resources | length > 0 else 'Not exposed' }}"
          - "For more information, see the README.md file"

