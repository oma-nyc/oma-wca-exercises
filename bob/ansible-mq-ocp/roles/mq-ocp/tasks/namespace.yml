---
# tasks/namespace.yml
#
# Namespace creation for mq-ocp role
#
# This file implements the creation and configuration of the OpenShift namespace
# for IBM MQ deployment.

- name: Check if namespace exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ mq_namespace }}"
  register: namespace_check
  tags:
    - namespace
    - setup

- name: Create namespace for IBM MQ
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ mq_namespace }}"
        labels:
          name: "{{ mq_namespace }}"
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
          # OpenShift 4.18 uses Kubernetes Pod Security Standards
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
          {% if mq_namespace_labels is defined %}
          {% for key, value in mq_namespace_labels.items() %}
          {{ key }}: "{{ value }}"
          {% endfor %}
          {% endif %}
  register: namespace_result
  when: mq_create_namespace | default(true) | bool
  tags:
    - namespace
    - setup

- name: Set resource quotas (if enabled)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: "{{ mq_app_label }}-quota"
        namespace: "{{ mq_namespace }}"
        labels:
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
      spec:
        hard:
          requests.cpu: "{{ mq_quota_cpu_request | default('4') }}"
          requests.memory: "{{ mq_quota_memory_request | default('4Gi') }}"
          limits.cpu: "{{ mq_quota_cpu_limit | default('8') }}"
          limits.memory: "{{ mq_quota_memory_limit | default('8Gi') }}"
          persistentvolumeclaims: "{{ mq_quota_pvc_count | default('5') }}"
          pods: "{{ mq_quota_pod_count | default('10') }}"
          services: "{{ mq_quota_service_count | default('5') }}"
  when: 
    - mq_create_resource_quota | default(false) | bool
    - namespace_result is defined
    - namespace_result.changed or namespace_check.resources | length > 0
  tags:
    - namespace
    - quota
    - setup

- name: Set limit range (if enabled)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: LimitRange
      metadata:
        name: "{{ mq_app_label }}-limits"
        namespace: "{{ mq_namespace }}"
        labels:
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
      spec:
        limits:
        - type: Container
          default:
            cpu: "{{ mq_cpu_limit }}"
            memory: "{{ mq_memory_limit }}"
          defaultRequest:
            cpu: "{{ mq_cpu_request }}"
            memory: "{{ mq_memory_request }}"
  when: 
    - mq_create_limit_range | default(false) | bool
    - namespace_result is defined
    - namespace_result.changed or namespace_check.resources | length > 0
  tags:
    - namespace
    - limits
    - setup

