---
# tasks/service_account.yml
#
# Service account creation for mq-ocp role
#
# This file implements the creation of service account, role, and role binding
# for IBM MQ deployment on OpenShift.

- name: Create service account for IBM MQ
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ mq_service_account }}"
        namespace: "{{ mq_namespace }}"
        labels:
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
  register: sa_result
  tags:
    - service_account
    - setup

- name: Create role for IBM MQ service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: "{{ mq_role_name }}"
        namespace: "{{ mq_namespace }}"
        labels:
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
      rules:
        - apiGroups: [""]
          resources: ["pods", "pods/exec", "services", "endpoints", "persistentvolumeclaims"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apps"]
          resources: ["deployments", "statefulsets"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["route.openshift.io"]
          resources: ["routes"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  register: role_result
  tags:
    - service_account
    - setup

- name: Create role binding for IBM MQ service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "{{ mq_role_binding_name }}"
        namespace: "{{ mq_namespace }}"
        labels:
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: "{{ mq_role_name }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ mq_service_account }}"
          namespace: "{{ mq_namespace }}"
  register: role_binding_result
  tags:
    - service_account
    - setup

- name: Add service account to security context constraints
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: security.openshift.io/v1
      kind: SecurityContextConstraints
      metadata:
        name: "{{ mq_scc_name }}"
      users:
        - "system:serviceaccount:{{ mq_namespace }}:{{ mq_service_account }}"
  register: scc_update_result
  tags:
    - service_account
    - security
    - setup

