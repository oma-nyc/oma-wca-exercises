---
# tasks/service.yml
#
# Service creation for mq-ocp role
#
# This file implements the creation of Kubernetes services for IBM MQ.

- name: Create service for IBM MQ
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ mq_service_name }}"
        namespace: "{{ mq_namespace }}"
        labels:
          app: "{{ mq_app_label }}"
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
        annotations:
          service.beta.kubernetes.io/description: "IBM MQ service for {{ mq_qmgr_name }}"
      spec:
        selector:
          app: "{{ mq_app_label }}"
        ports:
          {% for port in mq_port_mapping %}
          - name: {{ port.name }}
            port: {{ port.port }}
            targetPort: {{ port.targetPort }}
            protocol: {{ port.protocol }}
          {% endfor %}
        type: "{{ mq_service_type }}"
  register: service_result
  tags:
    - service
    - networking

- name: Display service information
  ansible.builtin.debug:
    msg: 
      - "Service Name: {{ mq_service_name }}"
      - "Namespace: {{ mq_namespace }}"
      - "Type: {{ mq_service_type }}"
      - "Ports:"
      {% for port in mq_port_mapping %}
      - "  - {{ port.name }}: {{ port.port }}/{{ port.protocol }}"
      {% endfor %}
  when: service_result.changed
  tags:
    - service
    - networking

- name: Wait for service endpoints to be ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Endpoints
    name: "{{ mq_service_name }}"
    namespace: "{{ mq_namespace }}"
  register: endpoints_status
  until: 
    - endpoints_status.resources is defined
    - endpoints_status.resources | length > 0
    - endpoints_status.resources[0].subsets is defined
    - endpoints_status.resources[0].subsets | length > 0
  retries: 10
  delay: 5
  when: service_result.changed
  tags:
    - service
    - networking

