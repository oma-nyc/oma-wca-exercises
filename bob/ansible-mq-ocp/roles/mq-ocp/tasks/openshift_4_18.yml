---
# tasks/openshift_4_18.yml
#
# OpenShift 4.18 specific configurations for mq-ocp role
#
# This file implements configurations specific to OpenShift 4.18.
# It includes features and best practices that are only available in OpenShift 4.18 or higher.

- name: Verify OpenShift version
  ansible.builtin.assert:
    that:
      - openshift_version is defined
      - openshift_version is version('4.18', '>=')
    fail_msg: "OpenShift version must be 4.18 or higher"
    success_msg: "OpenShift version requirement met"
  tags:
    - openshift
    - setup

- name: Create OpenShift 4.18 specific network policies
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: "{{ mq_app_label }}-network-policy"
        namespace: "{{ mq_namespace }}"
        labels:
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
      spec:
        podSelector:
          matchLabels:
            app: "{{ mq_app_label }}"
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: "{{ mq_app_label }}"
            ports:
              - protocol: TCP
                port: 1414
              - protocol: TCP
                port: 9443
        policyTypes:
          - Ingress
  when: mq_create_network_policy | default(true) | bool
  tags:
    - openshift
    - networking
    - security

- name: Create OpenShift 4.18 resource quotas
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: "{{ mq_app_label }}-quota"
        namespace: "{{ mq_namespace }}"
        labels:
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
      spec:
        hard:
          requests.cpu: "{{ mq_quota_cpu_request | default('4') }}"
          requests.memory: "{{ mq_quota_memory_request | default('4Gi') }}"
          limits.cpu: "{{ mq_quota_cpu_limit | default('8') }}"
          limits.memory: "{{ mq_quota_memory_limit | default('8Gi') }}"
          persistentvolumeclaims: "{{ mq_quota_pvc_count | default('5') }}"
          pods: "{{ mq_quota_pod_count | default('10') }}"
          services: "{{ mq_quota_service_count | default('5') }}"
  when: mq_create_resource_quota | default(false) | bool
  tags:
    - openshift
    - quota
    - setup

- name: Create OpenShift 4.18 priority class
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: scheduling.k8s.io/v1
      kind: PriorityClass
      metadata:
        name: "{{ mq_priority_class_name | default('mq-priority') }}"
        labels:
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
      value: "{{ mq_priority_value | default(1000) }}"
      globalDefault: false
      description: "Priority class for IBM MQ workloads"
  when: mq_create_priority_class | default(false) | bool
  tags:
    - openshift
    - scheduling
    - setup

- name: Update deployment with OpenShift 4.18 specific features
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ mq_deployment_name }}"
        namespace: "{{ mq_namespace }}"
      spec:
        template:
          spec:
            # OpenShift 4.18 supports priority class
            priorityClassName: "{{ mq_priority_class_name | default('mq-priority') }}"
            # OpenShift 4.18 supports pod disruption budget reference
            schedulerName: "{{ mq_scheduler_name | default('default-scheduler') }}"
  when: mq_create_priority_class | default(false) | bool
  tags:
    - openshift
    - deployment
    - update

- name: Create OpenShift 4.18 pod disruption budget
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: "{{ mq_app_label }}-pdb"
        namespace: "{{ mq_namespace }}"
        labels:
          app.kubernetes.io/name: ibm-mq
          app.kubernetes.io/managed-by: ansible
      spec:
        minAvailable: "{{ mq_pdb_min_available | default(1) }}"
        selector:
          matchLabels:
            app: "{{ mq_app_label }}"
  when: mq_create_pod_disruption_budget | default(true) | bool
  tags:
    - openshift
    - availability
    - setup

