---
# Variables for mq-ocp role (not meant to be overridden)

# Required collections
required_collections:
  - kubernetes.core
  - community.hashi_vault
  - community.general

# Required Python modules
required_python_modules:
  - openshift
  - kubernetes
  - hvac

# Vault connection settings
vault_connection_timeout: 30
vault_kv_version: 2

# OpenShift API versions
api_versions:
  namespace: v1
  service_account: v1
  role: rbac.authorization.k8s.io/v1
  role_binding: rbac.authorization.k8s.io/v1
  security_context_constraints: security.openshift.io/v1
  deployment: apps/v1
  service: v1
  route: route.openshift.io/v1
  pvc: v1
  config_map: v1
  secret: v1

# MQ container ports
mq_container_ports:
  - containerPort: 1414
    name: mq
    protocol: TCP
  - containerPort: 9443
    name: mqweb
    protocol: TCP
  - containerPort: 9157
    name: metrics
    protocol: TCP
    
# MQ environment variables
mq_base_env_vars:
  - name: LICENSE
    value: "{{ mq_license }}"
  - name: MQ_QMGR_NAME
    value: "{{ mq_qmgr_name }}"
  - name: MQ_ENABLE_METRICS
    value: "{{ mq_enable_prometheus | ternary('true', 'false') }}"

# MQ volume mounts
mq_base_volume_mounts:
  - name: data
    mountPath: /var/mqm
  - name: config
    mountPath: /etc/mqm/mq.ini
    subPath: mq.ini

# MQ volumes
mq_base_volumes:
  - name: data
    persistentVolumeClaim:
      claimName: "{{ mq_pvc_name }}"
  - name: config
    configMap:
      name: "{{ mq_config_map_name }}"

