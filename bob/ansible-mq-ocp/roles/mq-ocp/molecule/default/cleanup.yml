---
- name: Cleanup
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if test namespace exists
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ mq_namespace | default('mq-test') }}"
      register: namespace_result
      failed_when: false

    - name: Delete MQ resources if namespace exists
      when: namespace_result.resources | length > 0
      block:
        - name: Delete MQ route if it exists
          kubernetes.core.k8s:
            kind: Route
            namespace: "{{ mq_namespace | default('mq-test') }}"
            name: "{{ mq_route_name | default('mq-route') }}"
            state: absent
          failed_when: false

        - name: Delete MQ service if it exists
          kubernetes.core.k8s:
            kind: Service
            namespace: "{{ mq_namespace | default('mq-test') }}"
            name: "{{ mq_service_name | default('mq-service') }}"
            state: absent
          failed_when: false

        - name: Delete MQ deployment if it exists
          kubernetes.core.k8s:
            kind: Deployment
            namespace: "{{ mq_namespace | default('mq-test') }}"
            name: "{{ mq_deployment_name | default('mq-deployment') }}"
            state: absent
          failed_when: false

        - name: Delete MQ persistent volume claim if it exists
          kubernetes.core.k8s:
            kind: PersistentVolumeClaim
            namespace: "{{ mq_namespace | default('mq-test') }}"
            name: "{{ mq_pvc_name | default('mq-data-pvc') }}"
            state: absent
          failed_when: false

        - name: Delete MQ service account if it exists
          kubernetes.core.k8s:
            kind: ServiceAccount
            namespace: "{{ mq_namespace | default('mq-test') }}"
            name: "{{ mq_service_account | default('mq-service-account') }}"
            state: absent
          failed_when: false

        - name: Delete MQ role if it exists
          kubernetes.core.k8s:
            kind: Role
            namespace: "{{ mq_namespace | default('mq-test') }}"
            name: "{{ mq_role_name | default('mq-role') }}"
            state: absent
          failed_when: false

        - name: Delete MQ role binding if it exists
          kubernetes.core.k8s:
            kind: RoleBinding
            namespace: "{{ mq_namespace | default('mq-test') }}"
            name: "{{ mq_role_binding_name | default('mq-role-binding') }}"
            state: absent
          failed_when: false

        - name: Wait for resources to be deleted
          ansible.builtin.pause:
            seconds: 10

        - name: Delete test namespace
          kubernetes.core.k8s:
            kind: Namespace
            name: "{{ mq_namespace | default('mq-test') }}"
            state: absent
          failed_when: false

    - name: Display cleanup status
      ansible.builtin.debug:
        msg: "Cleanup completed. All test resources have been removed."

