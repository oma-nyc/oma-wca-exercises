---
# inventory/group_vars/all.yml
#
# Group variables for IBM MQ on OpenShift deployment
#
# This file contains default variables that can be overridden in inventory.
# Copy this file and customize it for your environment.

# OpenShift configuration
openshift_version: "4.18"
mq_namespace: "mq-prod"

# IBM MQ configuration
mq_qmgr_name: "QM1"
mq_image: "icr.io/ibm-messaging/mq"
mq_version: "9.3.0.0"
mq_license: "accept"

# Storage configuration
mq_storage_size: "2Gi"
mq_storage_class: ""  # Use default storage class

# Resource configuration
mq_cpu_request: "500m"
mq_memory_request: "512Mi"
mq_cpu_limit: "1"
mq_memory_limit: "1Gi"

# Networking configuration
mq_expose_web_console: true
mq_expose_mq_port: false

# Validation configuration
mq_validate_deployment: true
mq_create_test_queue: true
mq_cleanup_test_queue: true

# Vault configuration
vault_addr: "https://vault.example.com:8200"
vault_auth_method: "approle"
# vault_role_id: ""  # Provide securely
# vault_secret_id: ""  # Provide securely
vault_secret_path: "secret/mq"

# Made with Bob
