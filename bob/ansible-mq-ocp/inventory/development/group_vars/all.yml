---
# inventory/development/group_vars/all.yml
#
# Development group variables for IBM MQ on OpenShift deployment
#
# This file contains development-specific variables.

mq_namespace: "mq-dev"
mq_qmgr_name: "DEVQM"
mq_replicas: 1
mq_cpu_request: "500m"
mq_memory_request: "512Mi"
mq_cpu_limit: "1"
mq_memory_limit: "1Gi"
mq_storage_size: "1Gi"

# Development-specific settings
mq_create_network_policy: false
mq_create_resource_quota: false
mq_create_pod_disruption_budget: false
mq_create_test_queue: true

